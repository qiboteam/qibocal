[project]
name = "qibocal"
version = "0.2.7"
description = "Qibo's quantum calibration, characterization and validation module."
authors = [{name = "The Qibo team"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.10,<3.14"
dependencies = [
  "qibolab>=0.2.16,<0.3.0", # 0.2.16 exports ChannelId
  "qibo>=0.3.1,<0.4.0",
  "numpy>=2.0.0,<3.0.0",
  "scipy>=1.10.1,<2.0.0",
  "scikit-learn>=1.3.0,<2",
  "pandas[html]>=2.2.2,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "click>=8.1.3,<9.0.0",
  "jinja2>=3.1.2,<4.0.0",
  "plotly>=5.22.0,<6.0.0",
  "skops>=0.11,<0.14",
]

[project.urls]
Homepage = "https://qibo.science/"
Repository = "https://github.com/qiboteam/qibocal/"
Documentation = "https://qibo.science/qibocal/stable/"

[project.scripts]
qq = "qibocal:command"

[dependency-groups]
tests = [
  "qibolab>=0.2.16,<0.3.0", # "qibolab._core.platform.load.PLATFORMS" is renamed to "PLATFORMS_PATH", and import path for Hardware is changed https://github.com/qiboteam/qibolab/pull/1515
  "pytest>=7.1.2,<10.0.0",
  "pytest-cov>=3.0.0,<4.0.0",
  "pytest-env>=0.8.1,<0.9.0",
  "pytest-mock>=3.14.0,<4.0.0",
]
analysis = [
  "ruff>=0.16.0,<0.17.0",
]
docs = [
  "sphinx>=7.4.7,<8.0.0",
  "furo>=2023.3.27,<2024.0.0",
  "sphinxcontrib-bibtex>=2.6.0,<3.0.0",
  "recommonmark>=0.7.1,<0.8.0",
  "sphinx_markdown_tables>=0.0.17,<0.0.18",
  "sphinx-copybutton>=0.5.1,<0.6.0",
  "setuptools>=75.8,<84.0",
]
dev = [
  "ipython>=8.0,<9.0",
  "devtools>=0.10.0,<0.11.0",
  "marimo>=0.23.5,<0.24.0",
  "matplotlib>=3.10.9,<4.0.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["BLE001"] # TODO: BLE001 is about except Exception, fix properly

[tool.ruff.lint.per-file-ignores]
"calibration_scripts/**/*.py" = ["F821"]
"tests/calibration_scripts/**/*.py" = ["F821"]
"doc/dev/*.py" = ["B018"] # Marimo notebooks may use bare expressions to render output

[tool.poe.tasks]
test = "pytest"
lint = "ruff check"
lint-warnings = """
  ruff check --exit-zero \
  --select F,E,W,C90,N,UP,BLE,FBT,B,A,C4,T10,EM,EXE,ISC,ICN,LOG,G,INP,PIE,T20,PT,Q,RSE,\
           RET,SLF,SLOT,SIM,TC,INT,ARG,PTH,ERA,NPY,PERF,RUF
"""
docs = "make -C doc html"
docs-clean = "make -C doc clean"
test-docs = "make -C doc doctest"
types = "true"

[tool.pytest.ini_options]
testpaths = ['tests/']
addopts = ['--cov=qibocal', '--cov-report=xml', '--cov-report=html']
